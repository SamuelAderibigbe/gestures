[project]
name = "gesture-pipeline"
version = "0.6.0"
description = "Count gestures, talk time and on-screen time in recorded conference videos."
requires-python = ">=3.10,<3.14"
dependencies = [
    "ultralytics>=8.4",            # YOLO26 detection + tracking
    "lap>=0.5.12",                 # assignment solver used by the ByteTrack tracker
    "silero-vad>=5.1",             # speech detection for talk time (model bundled, CPU)
    "opencv-python>=4.10",         # same OpenCV package Ultralytics uses (avoid two copies)
    "numpy",
    "scipy>=1.10",                 # peak finding for nods / head shakes
    "pandas>=2.0",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gestures = "gesture_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gesture_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
